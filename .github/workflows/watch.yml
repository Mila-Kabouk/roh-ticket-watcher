name: Check RBO ticket availability

on:
  schedule:
    # Offset from the hour to avoid the busiest GitHub Actions scheduling times.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: roh-ticket-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the watcher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore availability history
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: roh-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            roh-state-

      - name: Install the watcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run one read-only sweep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: roh-ticket-watcher watch

      - name: Save availability history
        if: ${{ always() && hashFiles('data/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: roh-state-${{ github.run_id }}-${{ github.run_attempt }}
