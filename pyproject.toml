[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roh-ticket-watcher"
version = "2.0.0"
description = "Reusable read-only Royal Ballet and Opera ticket availability notifier"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "filelock>=3.15,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "responses>=0.25,<1",
]

[project.scripts]
roh-ticket-watcher = "roh_ticket_watcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
